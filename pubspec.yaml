name: scrcpy_flutter_gui
description: "A modern, powerful Flutter GUI for Scrcpy with keymapping, file explorer, device monitor, multi-device control, wireless ADB, webcam mode, and customizable presets."
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path: ^1.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
