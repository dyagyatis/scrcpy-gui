name: Build Multi-Platform (Windows, Linux, macOS)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Generate Windows Platform Files
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Application (Release)
        run: flutter build windows --release

      - name: Bundle with Scrcpy and ADB binaries
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          if (!(Test-Path "bin\scrcpy.exe")) {
            Write-Host "Downloading Scrcpy win64 release..."
            $url = "https://github.com/Genymobile/scrcpy/releases/download/v4.1/scrcpy-win64-v4.1.zip"
            Invoke-WebRequest -Uri $url -OutFile "scrcpy.zip"
            Expand-Archive -Path "scrcpy.zip" -DestinationPath "temp_scrcpy"
            New-Item -ItemType Directory -Force -Path "bin"
            Copy-Item -Path "temp_scrcpy\scrcpy-win64-v4.1\*" -Destination "bin" -Recurse -Force
          }
          
          # Copy bin folder next to the generated executable
          Copy-Item -Path "bin" -Destination "$buildDir\bin" -Recurse -Force
          
          # Create zip archive
          Compress-Archive -Path "$buildDir\*" -DestinationPath "Scrcpy-GUI-Flutter-Windows.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scrcpy-GUI-Flutter-Windows
          path: Scrcpy-GUI-Flutter-Windows.zip
          retention-days: 30

  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Generate Linux Platform Files
        run: flutter create --platforms=linux .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Application (Release)
        run: flutter build linux --release

      - name: Package Linux Application
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../Scrcpy-GUI-Flutter-Linux.tar.gz *

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scrcpy-GUI-Flutter-Linux
          path: Scrcpy-GUI-Flutter-Linux.tar.gz
          retention-days: 30

  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop Support
        run: flutter config --enable-macos-desktop

      - name: Generate macOS Platform Files
        run: flutter create --platforms=macos .

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Application (Release)
        run: flutter build macos --release

      - name: Package macOS Application
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../Scrcpy-GUI-Flutter-macOS.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scrcpy-GUI-Flutter-macOS
          path: Scrcpy-GUI-Flutter-macOS.zip
          retention-days: 30

  release:
    name: Publish Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Scrcpy-GUI-Flutter-Windows/Scrcpy-GUI-Flutter-Windows.zip
            Scrcpy-GUI-Flutter-Linux/Scrcpy-GUI-Flutter-Linux.tar.gz
            Scrcpy-GUI-Flutter-macOS/Scrcpy-GUI-Flutter-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
